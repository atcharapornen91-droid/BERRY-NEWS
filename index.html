<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Berry News 🍓</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="images/favicon.ico">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #F6F7F5;
  --text: #3A3A3A;
  --card: #ffffff;
  --subtext: #555;
  --border: #ddd;
}

body.dark {
  --bg: #1F2328;
  --text: #EAEAEA;
  --card: #2B2F36;
  --subtext: #CCC;
  --border: #333;
}

body {
  font-family: Inter, sans-serif;
  background: var(--bg);
  color: var(--text);
  margin: 0;
  min-height: 100vh;
  transition: 0.3s ease;
}

/* header */
header {
  padding: 1.5rem 2rem;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 10;
}

header h1 {
  margin: 0;
  font-family: 'Playfair Display', serif;
}

/* toggle */
#themeToggle {
  position: fixed;
  top: 1rem;
  right: 1rem;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  background: var(--card);
  font-size: 1.2rem;
  box-shadow: 0 6px 18px rgba(0,0,0,.15);
}

/* main */
main {
  max-width: 900px;
  margin: 2rem auto;
  padding: 0 1.5rem;
}

/* card */
.hero {
  display: grid;
  grid-template-columns: 1.3fr 1fr;
  gap: 1.5rem;
  background: var(--card);
  padding: 1.6rem;
  border-radius: 24px;
  margin-bottom: 2rem;
}

.hero img {
  width: 100%;
  border-radius: 20px;
}

.hero h2 {
  font-family: 'Playfair Display', serif;
  margin-top: 0;
}

/* reactions */
.reactions {
  display: flex;
  gap: .6rem;
  margin-top: 1rem;
}

.reaction-btn {
  position: relative;
  border: none;
  background: var(--card);
  color: var(--text);
  padding: .4rem .9rem;
  border-radius: 20px;
  cursor: pointer;
  font-size: .9rem;
}

.reaction-btn:disabled {
  opacity: .45;
  cursor: not-allowed;
}

/* bubble */
.bubble {
  position: absolute;
  bottom: 0;
  animation: floatUp 1.2s ease-out forwards;
  font-size: 1.4rem;
  pointer-events: none;
}

@keyframes floatUp {
  from { transform: translateY(0) scale(1); opacity: 1; }
  to { transform: translateY(-90px) scale(1.6); opacity: 0; }
}

body.dark .bubble {
  text-shadow: 0 0 12px rgba(255,255,255,.6);
}

@media(max-width:768px){
  .hero { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<button id="themeToggle">☀️</button>

<header>
  <h1>Berry News 🍓</h1>
</header>

<main id="newsContainer"></main>

<script>
/* ---------- API ---------- */
const API_URL =
"https://script.google.com/macros/s/AKfycbzRx5puJR7bFhvIgcX4PU4z6TZFcPuEXZwngnNPHaXx0Hl40q3-A7uUxiGEWseVTIcbgA/exec";

/* ---------- theme ---------- */
const toggle = document.getElementById("themeToggle");
if (localStorage.getItem("theme") === "dark") {
  document.body.classList.add("dark");
  toggle.textContent = "🌙";
}

toggle.onclick = () => {
  document.body.classList.toggle("dark");
  const dark = document.body.classList.contains("dark");
  toggle.textContent = dark ? "🌙" : "☀️";
  localStorage.setItem("theme", dark ? "dark" : "light");
};

/* ---------- reaction helpers ---------- */
function hasReacted(id, emoji) {
  return localStorage.getItem(`react_${id}_${emoji}`) === "1";
}
function markReacted(id, emoji) {
  localStorage.setItem(`react_${id}_${emoji}`, "1");
}

/* ---------- load news ---------- */
fetch(API_URL)
  .then(r => r.json())
  .then(renderNews);

function renderNews(list) {
  const el = document.getElementById("newsContainer");
  el.innerHTML = list.map(n => `
    <article class="hero" data-id="${n.id}">
      <div>
        <h2>${n.title}</h2>
        <p>${n.excerpt}</p>

        <div class="reactions">
          ${["👍","😂","😡"].map(e => `
            <button class="reaction-btn"
              onclick="react(this,'${e}')"
              ${hasReacted(n.id,e) ? "disabled":""}>
              ${e} <span>${n.reactions[e] || 0}</span>
            </button>
          `).join("")}
        </div>
      </div>
      <img src="${n.image}">
    </article>
  `).join("");
}

/* ---------- react ---------- */
function react(btn, emoji) {
  const card = btn.closest(".hero");
  const id = card.dataset.id;
  if (hasReacted(id, emoji)) return;

  markReacted(id, emoji);
  btn.disabled = true;

  /* bubble */
  for (let i=0;i<6;i++){
    const b=document.createElement("div");
    b.className="bubble";
    b.textContent=emoji;
    b.style.left = `${30+Math.random()*40}%`;
    b.style.animationDelay = `${i*0.07}s`;
    btn.appendChild(b);
    setTimeout(()=>b.remove(),1200);
  }

  /* update count */
  const span = btn.querySelector("span");
  span.textContent = Number(span.textContent)+1;

  /* send */
  fetch(`${API_URL}?action=react&id=${id}&emoji=${encodeURIComponent(emoji)}`);
}
</script>

</body>
</html>
